<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Watchtower Dev Center</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0e0e16;
  --surface:#17172a;
  --surface2:#1f1f35;
  --surface3:#272740;
  --border:#2d2d4a;
  --primary:#8ab4ff;
  --primary-dim:#3a5fc8;
  --text:#e4e4f0;
  --text2:#9090b0;
  --text3:#5a5a7a;
  --card:#1c1c30;
  --card-hover:#232340;
  --error:#ff6b6b;
  --success:#6bffb8;
  --radius:12px;
  --radius-sm:8px;
  --sidebar-w:300px;
}
html,body{height:100%;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text)}
a{color:inherit;text-decoration:none}

/* ── Layout ── */
#app{display:flex;height:100vh}
#sidebar{width:var(--sidebar-w);flex-shrink:0;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
#main{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* ── Sidebar header ── */
.sidebar-head{padding:18px 16px 12px;border-bottom:1px solid var(--border)}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.logo-icon{font-size:26px;line-height:1}
.logo-text{font-size:15px;font-weight:700;color:var(--primary);letter-spacing:.3px}
.logo-sub{font-size:10px;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-top:1px}

/* Type pills */
.type-pills{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.type-pill{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;border:1px solid var(--border);color:var(--text2);background:transparent;transition:all .15s;white-space:nowrap}
.type-pill:hover{border-color:var(--primary);color:var(--primary)}
.type-pill.active{background:var(--primary-dim);border-color:var(--primary);color:#fff}

/* Search */
.search-wrap{position:relative}
.search-wrap input{width:100%;padding:8px 12px 8px 32px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:13px;outline:none;transition:border-color .15s}
.search-wrap input:focus{border-color:var(--primary)}
.search-wrap .icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:14px;pointer-events:none}
.ext-count{font-size:11px;color:var(--text3);padding:6px 0 0;text-align:right}

/* ── Extension list ── */
#ext-list{flex:1;overflow-y:auto;padding:6px 0}
#ext-list::-webkit-scrollbar{width:4px}
#ext-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.ext-item{display:flex;align-items:center;gap:10px;padding:8px 14px;cursor:pointer;transition:background .12s;border-left:3px solid transparent}
.ext-item:hover{background:var(--surface2)}
.ext-item.active{background:var(--surface3);border-left-color:var(--primary)}
.ext-icon{width:36px;height:36px;border-radius:8px;object-fit:cover;background:var(--surface3);flex-shrink:0}
.ext-icon-fallback{width:36px;height:36px;border-radius:8px;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.ext-info{flex:1;min-width:0}
.ext-name{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ext-meta{display:flex;align-items:center;gap:5px;margin-top:2px}
.lang-badge{font-size:10px;padding:1px 6px;border-radius:4px;background:var(--surface3);color:var(--text2);font-weight:600;text-transform:uppercase}
.type-badge{font-size:10px;color:var(--text3)}
.nsfw-dot{width:5px;height:5px;border-radius:50%;background:#ff6b6b;flex-shrink:0}

/* ── Main panel ── */
#main-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:var(--text3)}
#main-empty .big-icon{font-size:64px;opacity:.3}
#main-empty p{font-size:15px}

/* Extension panel */
#ext-panel{flex:1;display:flex;flex-direction:column;overflow:hidden}
.ext-header{padding:20px 24px 0;border-bottom:1px solid var(--border);background:var(--surface)}
.ext-hrow{display:flex;align-items:center;gap:16px;margin-bottom:16px}
.ext-h-icon{width:56px;height:56px;border-radius:12px;object-fit:cover;background:var(--surface2)}
.ext-h-icon-fb{width:56px;height:56px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:26px}
.ext-h-info{flex:1}
.ext-h-name{font-size:20px;font-weight:700}
.ext-h-row2{display:flex;align-items:center;gap:8px;margin-top:6px;flex-wrap:wrap}
.badge{padding:3px 10px;border-radius:6px;font-size:11px;font-weight:700;text-transform:uppercase}
.badge-type{background:var(--primary-dim);color:#c8d8ff}
.badge-lang{background:var(--surface3);color:var(--text2)}
.badge-nsfw{background:#5a1a1a;color:#ff9090}
.badge-ver{background:var(--surface3);color:var(--text3)}
.ext-h-url{font-size:12px;color:var(--text3);margin-top:4px;word-break:break-all}

/* Tabs */
.tabs{display:flex;gap:0;padding:0 24px}
.tab{padding:12px 20px;font-size:13px;font-weight:600;color:var(--text2);cursor:pointer;border-bottom:2px solid transparent;transition:all .15s;user-select:none}
.tab:hover{color:var(--text)}
.tab.active{color:var(--primary);border-bottom-color:var(--primary)}

/* ── Content area ── */
#content-area{flex:1;overflow-y:auto;padding:20px 24px}
#content-area::-webkit-scrollbar{width:6px}
#content-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* Search bar in tab */
.search-tab-wrap{display:flex;gap:10px;margin-bottom:20px}
.search-tab-wrap input{flex:1;padding:10px 16px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-size:14px;outline:none}
.search-tab-wrap input:focus{border-color:var(--primary)}
.search-tab-wrap button{padding:10px 20px;background:var(--primary-dim);border:none;border-radius:var(--radius-sm);color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:background .15s}
.search-tab-wrap button:hover{background:var(--primary)}

/* Results grid */
.results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px}
.result-card{background:var(--card);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:transform .15s,background .15s;border:1px solid transparent}
.result-card:hover{transform:translateY(-3px);background:var(--card-hover);border-color:var(--border)}
.result-card .poster{width:100%;aspect-ratio:2/3;object-fit:cover;background:var(--surface3);display:block}
.result-card .poster-fb{width:100%;aspect-ratio:2/3;background:var(--surface3);display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--text3)}
.result-card .card-title{padding:8px;font-size:12px;font-weight:600;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

/* Pagination */
.pagination{display:flex;align-items:center;justify-content:center;gap:12px;padding:24px 0 8px}
.page-btn{padding:8px 20px;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text2);font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.page-btn:hover:not(:disabled){border-color:var(--primary);color:var(--primary)}
.page-btn:disabled{opacity:.3;cursor:default}
.page-num{font-size:13px;color:var(--text3);min-width:60px;text-align:center}

/* States */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:60px;color:var(--text3)}
.spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-box{background:#1a0a0a;border:1px solid #5a1a1a;border-radius:var(--radius);padding:16px 20px;color:var(--error);font-size:13px}
.empty-box{text-align:center;padding:60px;color:var(--text3);font-size:14px}

/* Detail overlay */
#detail-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);z-index:100;display:none;align-items:flex-start;justify-content:center;padding:24px;overflow-y:auto}
#detail-overlay.open{display:flex}
.detail-panel{background:var(--surface);border:1px solid var(--border);border-radius:16px;width:100%;max-width:640px;overflow:hidden}
.detail-head{display:flex;gap:16px;padding:20px;border-bottom:1px solid var(--border)}
.detail-cover{width:100px;height:148px;object-fit:cover;border-radius:10px;background:var(--surface2)}
.detail-cover-fb{width:100px;height:148px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:40px}
.detail-info{flex:1;min-width:0}
.detail-title{font-size:18px;font-weight:700;margin-bottom:8px;line-height:1.3}
.detail-desc{font-size:13px;color:var(--text2);line-height:1.5;margin-top:8px;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.detail-genres{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px}
.genre-tag{padding:3px 10px;background:var(--surface3);border-radius:20px;font-size:11px;color:var(--text2)}
.detail-close{position:absolute;top:16px;right:16px;background:var(--surface3);border:none;border-radius:50%;width:32px;height:32px;color:var(--text);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.chapters-list{padding:0 20px 20px;max-height:320px;overflow-y:auto}
.chapters-list h3{font-size:13px;color:var(--text3);font-weight:600;padding:14px 0 8px;text-transform:uppercase;letter-spacing:.5px}
.chapter-item{padding:10px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;cursor:pointer;transition:color .12s}
.chapter-item:hover{color:var(--primary)}
.chapter-item:last-child{border-bottom:none}
.ch-name{font-size:13px;flex:1}
.ch-date{font-size:11px;color:var(--text3);flex-shrink:0}

/* Skeleton */
.skeleton{background:linear-gradient(90deg,var(--surface2) 25%,var(--surface3) 50%,var(--surface2) 75%);background-size:200% 100%;animation:shimmer 1.2s infinite;border-radius:var(--radius-sm)}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.sk-card{border-radius:var(--radius);overflow:hidden;background:var(--card)}
.sk-poster{aspect-ratio:2/3;width:100%}
.sk-title{height:12px;margin:8px;margin-top:6px}
.sk-title2{height:10px;margin:4px 8px 8px;width:60%}
</style>
</head>
<body>
<div id="app">
  <!-- ── Sidebar ── -->
  <div id="sidebar">
    <div class="sidebar-head">
      <div class="logo">
        <div class="logo-icon">🗼</div>
        <div>
          <div class="logo-text">Watchtower</div>
          <div class="logo-sub">Dev Center</div>
        </div>
      </div>
      <div class="type-pills" id="type-pills">
        <button class="type-pill active" data-type="all">All</button>
        <button class="type-pill" data-type="watch">🎬 Watch</button>
        <button class="type-pill" data-type="manga">📚 Manga</button>
        <button class="type-pill" data-type="novel">📖 Novel</button>
        <button class="type-pill" data-type="music">🎵 Music</button>
        <button class="type-pill" data-type="game">🎮 Game</button>
      </div>
      <div class="search-wrap">
        <span class="icon">🔍</span>
        <input type="text" id="ext-search" placeholder="Search extensions…" autocomplete="off"/>
      </div>
      <div class="ext-count" id="ext-count">Loading…</div>
    </div>
    <div id="ext-list"></div>
  </div>

  <!-- ── Main ── -->
  <div id="main">
    <div id="main-empty">
      <div class="big-icon">🗼</div>
      <p>Select an extension to get started</p>
    </div>
    <div id="ext-panel" style="display:none">
      <div class="ext-header">
        <div class="ext-hrow">
          <img class="ext-h-icon" id="hdr-icon" src="" alt="" onerror="this.style.display='none';document.getElementById('hdr-icon-fb').style.display='flex'"/>
          <div class="ext-h-icon-fb" id="hdr-icon-fb" style="display:none">📦</div>
          <div class="ext-h-info">
            <div class="ext-h-name" id="hdr-name"></div>
            <div class="ext-h-row2" id="hdr-badges"></div>
            <div class="ext-h-url" id="hdr-url"></div>
          </div>
        </div>
        <div class="tabs">
          <div class="tab active" data-tab="popular">Popular</div>
          <div class="tab" data-tab="latest">Latest</div>
          <div class="tab" data-tab="search">Search</div>
        </div>
      </div>
      <div id="content-area"></div>
    </div>
  </div>
</div>

<!-- ── Detail overlay ── -->
<div id="detail-overlay">
  <div class="detail-panel" style="position:relative">
    <button class="detail-close" id="detail-close">✕</button>
    <div class="detail-head">
      <img class="detail-cover" id="det-cover" src="" alt="" onerror="this.style.display='none';document.getElementById('det-cover-fb').style.display='flex'"/>
      <div class="detail-cover-fb" id="det-cover-fb" style="display:none">📦</div>
      <div class="detail-info">
        <div class="detail-title" id="det-title"></div>
        <div class="detail-genres" id="det-genres"></div>
        <div class="detail-desc" id="det-desc"></div>
      </div>
    </div>
    <div class="chapters-list">
      <h3 id="det-ch-label">Episodes / Chapters</h3>
      <div id="det-chapters"></div>
    </div>
  </div>
</div>

<script>
const state = {
  allExtensions: [],
  filtered: [],
  activeType: 'all',
  searchQ: '',
  currentExt: null,
  activeTab: 'popular',
  page: 1,
  loading: false,
};

const $ = id => document.getElementById(id);

// ── Flag emoji ─────────────────────────────────────────────────────────────
function flagEmoji(lang) {
  if (!lang) return '';
  const map = {
    'en':'🇬🇧','fr':'🇫🇷','es':'🇪🇸','de':'🇩🇪','pt':'🇵🇹','pt-br':'🇧🇷',
    'it':'🇮🇹','nl':'🇳🇱','ja':'🇯🇵','ko':'🇰🇷','zh':'🇨🇳','zh-hk':'🇭🇰',
    'ru':'🇷🇺','ar':'🇸🇦','tr':'🇹🇷','id':'🇮🇩','vi':'🇻🇳','th':'🇹🇭',
    'pl':'🇵🇱','cs':'🇨🇿','uk':'🇺🇦','hu':'🇭🇺','ro':'🇷🇴','sv':'🇸🇪',
    'fi':'🇫🇮','da':'🇩🇰','no':'🇳🇴','he':'🇮🇱','hi':'🇮🇳','bg':'🇧🇬',
    'hr':'🇭🇷','sk':'🇸🇰','el':'🇬🇷','ms':'🇲🇾','fa':'🇮🇷','all':'🌍',
  };
  return map[lang.toLowerCase()] || '🏳️';
}

// ── API helpers ────────────────────────────────────────────────────────────
async function api(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return r.json();
}

// ── Load extension list ────────────────────────────────────────────────────
async function loadExtensions() {
  try {
    const params = new URLSearchParams();
    if (state.activeType !== 'all') params.set('type', state.activeType);
    if (state.searchQ) params.set('q', state.searchQ);
    const res = await api(`/api/extensions?${params}`);
    state.allExtensions = res.extensions;
    state.filtered = res.extensions;
    $('ext-count').textContent = `${res.count} JS extensions`;
    renderExtList();
  } catch(e) {
    $('ext-count').textContent = 'Load error';
  }
}

function renderExtList() {
  const list = $('ext-list');
  if (!state.filtered.length) {
    list.innerHTML = '<div style="padding:24px;text-align:center;color:var(--text3);font-size:13px">No extensions found</div>';
    return;
  }
  list.innerHTML = state.filtered.map(ext => `
    <div class="ext-item ${state.currentExt?.id === ext.id ? 'active':''}" data-id="${ext.id}" onclick="selectExt(${ext.id})">
      <img class="ext-icon" src="${ext.iconUrl||''}" alt="" onerror="this.style.display='none';this.nextSibling.style.display='flex'"/>
      <div class="ext-icon-fallback" style="display:none">${ext._typeEmoji||'📦'}</div>
      <div class="ext-info">
        <div class="ext-name">${esc(ext.name)}</div>
        <div class="ext-meta">
          <span class="lang-badge">${flagEmoji(ext.lang)} ${esc(ext.lang||'all')}</span>
          <span class="type-badge">${ext._typeLabel||''}</span>
          ${ext.isNsfw?'<div class="nsfw-dot" title="NSFW"></div>':''}
        </div>
      </div>
    </div>
  `).join('');
}

// ── Select extension ───────────────────────────────────────────────────────
function selectExt(id) {
  const ext = state.filtered.find(e => e.id === id) || state.allExtensions.find(e => e.id === id);
  if (!ext) return;
  state.currentExt = ext;
  state.activeTab = 'popular';
  state.page = 1;

  // Update sidebar highlight
  document.querySelectorAll('.ext-item').forEach(el => {
    el.classList.toggle('active', +el.dataset.id === id);
  });

  // Show panel
  $('main-empty').style.display = 'none';
  $('ext-panel').style.display = 'flex';
  $('ext-panel').style.flexDirection = 'column';

  // Fill header
  $('hdr-icon').src = ext.iconUrl || '';
  $('hdr-icon').style.display = '';
  $('hdr-icon-fb').style.display = 'none';
  $('hdr-name').textContent = ext.name;
  $('hdr-url').textContent = ext.baseUrl || '';
  const badges = [
    `<span class="badge badge-type">${ext._typeEmoji} ${ext._typeLabel}</span>`,
    `<span class="badge badge-lang">${flagEmoji(ext.lang)} ${ext.lang||'all'}</span>`,
    `<span class="badge badge-ver">v${ext.version||'?'}</span>`,
    ext.isNsfw ? '<span class="badge badge-nsfw">18+</span>' : '',
  ].join('');
  $('hdr-badges').innerHTML = badges;

  // Reset tabs
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === 'popular'));

  loadTab();
}

// ── Tabs ───────────────────────────────────────────────────────────────────
document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    if (!state.currentExt) return;
    state.activeTab = t.dataset.tab;
    state.page = 1;
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    loadTab();
  });
});

function loadTab() {
  const tab = state.activeTab;
  const area = $('content-area');
  if (tab === 'search') {
    area.innerHTML = `
      <div class="search-tab-wrap">
        <input type="text" id="search-input" placeholder="Search…" autocomplete="off" onkeydown="if(event.key==='Enter')doSearch()"/>
        <button onclick="doSearch()">Search</button>
      </div>
      <div id="search-results"></div>
    `;
    $('search-input').focus();
  } else {
    loadResults(tab === 'popular' ? 'popular' : 'latest');
  }
}

function doSearch() {
  const q = $('search-input')?.value?.trim();
  if (!q) return;
  state.page = 1;
  loadResults('search', q);
}

// ── Load results ───────────────────────────────────────────────────────────
async function loadResults(endpoint, query = '') {
  if (!state.currentExt || state.loading) return;
  state.loading = true;
  const ext = state.currentExt;
  const target = endpoint === 'search' ? $('search-results') : $('content-area');
  if (endpoint !== 'search') {
    target.innerHTML = renderSkeleton(12);
  } else {
    target.innerHTML = renderSkeleton(12);
  }
  try {
    const params = new URLSearchParams({ page: state.page });
    if (query) params.set('q', query);
    const res = await api(`/api/ext/${ext.id}/${endpoint}?${params}`);
    if (res.ok && res.data) {
      renderResults(target, res.data, endpoint, query);
    } else {
      target.innerHTML = `<div class="error-box">⚠️ ${esc(res.error || 'Unknown error')}</div>`;
    }
  } catch(e) {
    target.innerHTML = `<div class="error-box">⚠️ ${esc(e.message)}</div>`;
  } finally {
    state.loading = false;
  }
}

function renderResults(target, data, endpoint, query) {
  const list = data.list || data.results || data || [];
  const hasNext = data.hasNextPage ?? data.hasNext ?? false;

  if (!list.length) {
    target.innerHTML = '<div class="empty-box">No results found</div>';
    return;
  }

  const cards = list.map(item => {
    const title = esc(item.name || item.title || '?');
    const img = item.imageUrl || item.image || item.thumbnail || item.cover || '';
    const link = item.link || item.url || '';
    return `
      <div class="result-card" onclick="openDetail(${JSON.stringify(JSON.stringify({...item, _link: link}))})">
        ${img
          ? `<img class="poster" src="${esc(img)}" alt="${title}" loading="lazy" onerror="this.style.display='none';this.nextSibling.style.display='flex'"/><div class="poster-fb" style="display:none">🖼️</div>`
          : `<div class="poster-fb">🖼️</div>`}
        <div class="card-title">${title}</div>
      </div>`;
  }).join('');

  const pagination = `
    <div class="pagination">
      <button class="page-btn" ${state.page <= 1 ? 'disabled' : ''} onclick="changePage(-1, '${endpoint}', ${JSON.stringify(query)})">← Prev</button>
      <span class="page-num">Page ${state.page}</span>
      <button class="page-btn" ${!hasNext ? 'disabled' : ''} onclick="changePage(1, '${endpoint}', ${JSON.stringify(query)})">Next →</button>
    </div>`;

  target.innerHTML = `<div class="results-grid">${cards}</div>${pagination}`;
}

function changePage(delta, endpoint, query) {
  state.page = Math.max(1, state.page + delta);
  loadResults(endpoint, query);
  $('content-area').scrollTop = 0;
}

// ── Skeleton ───────────────────────────────────────────────────────────────
function renderSkeleton(n) {
  const card = `<div class="sk-card"><div class="skeleton sk-poster"></div><div class="skeleton sk-title"></div><div class="skeleton sk-title2"></div></div>`;
  return `<div class="results-grid">${card.repeat(n)}</div>`;
}

// ── Detail ─────────────────────────────────────────────────────────────────
async function openDetail(itemJson) {
  const item = JSON.parse(itemJson);
  const link = item._link || item.link || item.url || '';
  if (!link || !state.currentExt) return;

  const overlay = $('detail-overlay');
  overlay.classList.add('open');

  // Prefill with card data while loading
  $('det-cover').src = item.imageUrl || item.image || '';
  $('det-cover').style.display = '';
  $('det-cover-fb').style.display = 'none';
  $('det-title').textContent = item.name || item.title || '?';
  $('det-desc').textContent = '';
  $('det-genres').innerHTML = '';
  $('det-chapters').innerHTML = '<div class="loading"><div class="spinner"></div><span>Loading detail…</span></div>';

  try {
    const ext = state.currentExt;
    const params = new URLSearchParams({ url: link });
    const res = await api(`/api/ext/${ext.id}/detail?${params}`);
    if (res.ok && res.data) {
      const d = res.data;
      $('det-title').textContent = d.name || item.name || '?';
      $('det-cover').src = d.imageUrl || item.imageUrl || '';
      $('det-desc').textContent = d.description || d.summary || '';
      const genres = d.genres || d.tags || [];
      $('det-genres').innerHTML = genres.map(g => `<span class="genre-tag">${esc(g)}</span>`).join('');
      const chapters = d.chapters || d.episodes || [];
      const label = ext._type === 'manga' || ext._type === 'novel' ? 'Chapters' : 'Episodes';
      $('det-ch-label').textContent = `${label} (${chapters.length})`;
      if (chapters.length) {
        $('det-chapters').innerHTML = chapters.slice(0,100).map(ch => `
          <div class="chapter-item">
            <span class="ch-name">${esc(ch.name || ch.title || '?')}</span>
            ${ch.dateUpload ? `<span class="ch-date">${esc(ch.dateUpload)}</span>` : ''}
          </div>`).join('');
      } else {
        $('det-chapters').innerHTML = '<div style="color:var(--text3);font-size:13px;padding:12px 0">No episodes/chapters found</div>';
      }
    } else {
      $('det-chapters').innerHTML = `<div class="error-box">⚠️ ${esc(res.error || 'Error loading detail')}</div>`;
    }
  } catch(e) {
    $('det-chapters').innerHTML = `<div class="error-box">⚠️ ${esc(e.message)}</div>`;
  }
}

$('detail-close').onclick = () => $('detail-overlay').classList.remove('open');
$('detail-overlay').onclick = e => { if (e.target === $('detail-overlay')) $('detail-overlay').classList.remove('open'); };

// ── Type pills ─────────────────────────────────────────────────────────────
$('type-pills').addEventListener('click', e => {
  const btn = e.target.closest('.type-pill');
  if (!btn) return;
  state.activeType = btn.dataset.type;
  document.querySelectorAll('.type-pill').forEach(p => p.classList.remove('active'));
  btn.classList.add('active');
  loadExtensions();
});

// ── Extension search ───────────────────────────────────────────────────────
let searchTimer;
$('ext-search').addEventListener('input', e => {
  state.searchQ = e.target.value;
  clearTimeout(searchTimer);
  searchTimer = setTimeout(loadExtensions, 200);
});

// ── Helpers ────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Boot ───────────────────────────────────────────────────────────────────
loadExtensions();
</script>
</body>
</html>
